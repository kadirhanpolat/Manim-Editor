name: manim_motion

services:
  # Init service to create directories with correct permissions
  init:
    image: alpine:3.19
    volumes:
      - manim_motion_data:/data
    command: >
      sh -c "mkdir -p /data/projects /data/assets /data/assets/audio /data/renders &&
             chmod -R 777 /data &&
             echo 'Data directories initialized'"
    restart: "no"

  redis:
    image: redis:7-alpine
    # Not published to the host: the app reaches redis over the internal Docker
    # network (REDIS_URL=redis://redis:6379). Publishing 6379 only invited host
    # port clashes with other local projects. Add a `ports` mapping back if you
    # need redis-cli from the host.
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      - NODE_ENV=development
      - DATA_DIR=/data
      - REDIS_URL=redis://redis:6379
      - PORT=3000
    volumes:
      - manim_motion_data:/data
      - ./services/api/src:/app/services/api/src
      - ./packages/manim-codegen/src:/app/packages/manim-codegen/src
      - root_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  renderer:
    build: ./services/renderer
    environment:
      - DATA_DIR=/data
      - REDIS_URL=redis://redis:6379
    volumes:
      - manim_motion_data:/data
    depends_on:
      init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5

  renderer-2:
    build: ./services/renderer
    environment:
      - DATA_DIR=/data
      - REDIS_URL=redis://redis:6379
    volumes:
      - manim_motion_data:/data
    depends_on:
      init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5

  audio:
    build: ./services/audio
    environment:
      - DATA_DIR=/data
      - REDIS_URL=redis://redis:6379
      - API_URL=http://api:3000
    volumes:
      - manim_motion_data:/data
    depends_on:
      init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  audio-coqui:
    build:
      context: ./services/audio
      dockerfile: Dockerfile.coqui
    environment:
      - DATA_DIR=/data
      - REDIS_URL=redis://redis:6379
      - API_URL=http://api:3000
      - ENABLE_COQUI=1
    volumes:
      - manim_motion_data:/data
      - coqui_models:/root/.local/share/tts
    depends_on:
      init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    profiles:
      - coqui
    deploy:
      resources:
        limits:
          memory: 4G
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3

  web:
    build:
      context: .
      dockerfile: services/web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

  web-dev:
    build:
      context: .
      dockerfile: services/web/Dockerfile
      target: deps
    working_dir: /app/services/web
    command: npx vite --host 0.0.0.0 --port 5173
    environment:
      - VITE_API_TARGET=http://api:3000
    volumes:
      - ./services/web/src:/app/services/web/src
      - ./services/web/public:/app/services/web/public
      - ./services/web/index.html:/app/services/web/index.html
      - ./services/web/vite.config.js:/app/services/web/vite.config.js
      - ./packages/manim-codegen/src:/app/packages/manim-codegen/src
      - web_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api
    profiles:
      - dev

volumes:
  manim_motion_data:
  redis_data:
  root_node_modules:
  web_node_modules:
  coqui_models:
