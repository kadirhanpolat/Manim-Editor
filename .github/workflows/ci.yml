name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - name: Lint (ESLint)
        run: npm run lint
      - name: Prettier format check
        run: npm run format:check
      - name: Typecheck (codegen + web + api)
        run: npm run typecheck
      - name: Web unit tests
        run: npm run test:unit --workspace services/web
      - name: Engine tests
        run: npm test --workspace services/web
      - name: API tests
        run: npm test --workspace services/api

  e2e:
    runs-on: ubuntu-latest
    # Non-blocking: the Playwright smoke suite boots a real browser + dev server,
    # so a flaky run shouldn't gate every push. It still runs + reports on each push.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install workspace deps (web dev server)
        run: npm ci
      - name: Install e2e deps
        run: npm ci
        working-directory: e2e
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Run Playwright smoke tests
        run: npm test
        working-directory: e2e

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install ruff black
      - name: Ruff
        run: ruff check services/renderer/worker.py services/audio/worker.py services/web/tests/helpers/ast_check.py
      - name: Black
        run: black --check services/renderer/worker.py services/audio/worker.py services/web/tests/helpers/ast_check.py
