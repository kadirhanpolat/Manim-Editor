name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - name: Lint (ESLint)
        run: npm run lint
      - name: Prettier format check
        run: npm run format:check
      - name: Typecheck (codegen + web + api)
        run: npm run typecheck
      - name: Web unit tests
        run: npm run test:unit --workspace services/web
      - name: Engine tests
        run: npm test --workspace services/web
      - name: API tests
        run: npm test --workspace services/api

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install workspace deps (web dev server)
        run: npm ci
      - name: Install e2e deps
        run: npm ci
        working-directory: e2e
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Run Playwright smoke tests
        run: npm test
        working-directory: e2e

  render-harness:
    runs-on: ubuntu-latest
    # Non-blocking: this exercises real Manim + LaTeX/Pillow render paths. It is
    # valuable signal, but too heavyweight and environment-sensitive to gate pushes.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system render deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libcairo2-dev libpango1.0-dev dvisvgm texlive-latex-base texlive-latex-extra texlive-fonts-recommended
      - name: Install node deps
        run: npm ci
      - name: Install Manim render deps
        run: python -m pip install manim==0.20.1 manim-fonts pillow
      - name: Run render-truth and golden-frame harnesses
        run: RUN_MANIM_RENDER=1 npm run test:render --workspace services/web

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install ruff black
      - name: Ruff
        run: ruff check services/renderer/worker.py services/audio/worker.py services/web/tests/helpers/ast_check.py
      - name: Black
        run: black --check services/renderer/worker.py services/audio/worker.py services/web/tests/helpers/ast_check.py
